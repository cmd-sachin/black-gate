steps:
  # 1. Build the container image using the Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:$COMMIT_SHA'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:latest'
      - '.'

  # 2. Push the container image to GCP Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:latest'

  # 3. Deploy the container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=ES_URL=$_ES_URL,ES_API_KEY=$_ES_API_KEY,ELASTIC_MCP_URL=$_ELASTIC_MCP_URL,GEMINI_API_KEY=$_GEMINI_API_KEY'

images:
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:$COMMIT_SHA'
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/soc-ai-agent:latest'

substitutions:
  _AR_REGION: 'us-central1'
  _AR_REPO: 'soc-containers'
  _SERVICE_NAME: 'soc-ai-agent-service'
  _DEPLOY_REGION: 'us-central1'
  _ES_URL: 'https://your-elastic-cloud-url'
  _ES_API_KEY: 'your-elasticsearch-api-key'
  _ELASTIC_MCP_URL: 'https://your-elastic-agent-builder-mcp-url'
  _GEMINI_API_KEY: 'your-gemini-api-key'

options:
  logging: CLOUD_LOGGING_ONLY
