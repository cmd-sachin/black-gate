version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: blackgate-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - blackgate_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackgate-backend
    ports:
      - "8001:8080" # Maps host 8001 to container 8080
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PORT=8080
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    env_file:
      - .env
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - blackgate_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blackgate-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - blackgate_net

volumes:
  esdata:

networks:
  blackgate_net:
    driver: bridge
